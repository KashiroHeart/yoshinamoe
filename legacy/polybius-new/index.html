<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:url" content="https://4472.web.fc2.com/">
    <meta property="og:type" content="article">
    <meta property="og:title" content="ポリュビオス暗号ツール">
    <meta property="og:description" content="？">
    <meta property="og:site_name" content="囹圄">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="/src/jquery.pjax.js"></script>
    <script src="/src/main.js"></script>
    <title>ポリュビオス暗号ツール</title>
  </head>
  <body>
    <div class="container">
      <div class="sidemenu">
      </div>
      <article class="article">
        <header class="article-header">
          <a class="sidemenu-trigger" href="javascript:void(0);" style="display:none;"><svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 -960 960 960"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg></a>
          <h1>ポリュビオス暗号ツール（未完成）</h1>
        </header>
        <div id="article" class="article-content">
          <div id="tool_display">
            <form id="tool_input" name="input">
              <div class="flex">
                <fieldset class="noborder tool-window flex">
                  <legend class="left">変換</legend>
                  <div id="rawtext_input" class="tool-window inline-block">
                    <p class="tool-window"><label for="rawtext_input_textarea"><textarea id="rawtext_input_textarea" name="rawtext_input_textarea" rows="5em" cols="30em" placeholder="ここに平文を入力してください。">polybius is nice method</textarea></label><br>文字数：<span id="rawtext_input_length">0</span></p>
                  </div><div id="rawtext_output" class="tool-window inline-block">
                    <p class="tool-window"><label for="rawtext_output_textarea"><textarea id="rawtext_output_textarea" name="rawtext_output_textarea" rows="5em" cols="30em" readonly placeholder="ここに変換結果が表示されます。"></textarea></label><br>文字数：<span id="rawtext_output_length">0</span></p>
                  </div>
                </fieldset>
                <fieldset class="noborder tool-window">
                  <legend class="left">暗号表プレビュー</legend>
                  <table border>
                    <tbody id="preview" class="preview-table">
                    </tbody>
                  </table>
                </fieldset>
                <fieldset class="noborder tool-window" style="width:100%; white-space:normal;">
                  <legend class="left">詳細設定</legend>
                  <div id="polybius_array_input" class="tool-window">
                    <table>
                      <tbody>
                        <tr>
                          <th class="tool-window full-label"><label for="convert_type">変換方法</label></th>
                          <td>
                            <select id="convert_type" name="convert_type">
                              <option value="0">暗号化モード</option>
                              <option value="1">暗号解読モード</option>
                            </select>
                          </td>
                        </tr>
                        <tr>
                          <th class="tool-window full-label"><label for="polybius_type">暗号方式</label></th>
                          <td>
                            <select id="polybius_type" name="polybius_type">
                              <option value="0">ポリュビオス暗号</option>
                              <option value="1" disabled>忍びいろは暗号</option>
                            </select>
                          </td>
                        </tr>
                        <tr>
                          <th class="tool-window full-label"><label for="polybius_array_textarea">暗号文配列</label></th>
                          <td>
                            <select id="polybius_array_cipher" name="polybius_array_cipher">
                              <option value="0">数字＋英字</option>
                              <option value="1">五十音</option>
                              <option value="2">自由入力</option>
                            </select>
                            <br><textarea id="polybius_array_textarea" name="polybius_array_textarea" rows="5em" cols="30em" readonly>123456789abcdefghijklmnopqrstuvwxyz</textarea>
                            <br>有効値個数：<span id="polybius_array_textarea_length">0</span>
                          </td>
                        </tr>
                        <tr class="hidden">
                          <th class="tool-window full-label"><label for="polybius_array2_textarea">暗号文配列2<br>（縦）</label></th>
                          <td>
                            <select id="polybius_array2_cipher" name="polybius_array2_cipher">
                              <option value="0">数字＋英字</option>
                              <option value="1">五十音</option>
                              <option value="2">自由入力</option>
                            </select>
                            <br><textarea id="polybius_array2_textarea" name="polybius_array2_textarea" rows="5em" cols="30em" readonly>123456789abcdefghijklmnopqrstuvwxyz</textarea>
                            <br>有効値個数：<span id="polybius_array2_textarea_length">0</span>
                          </td>
                        </tr>
                        <tr>
                          <th class="tool-window full-label"><label for="polybius_rawarray_textarea">平文配列</label></th>
                          <td>
                            <select id="polybius_array_raw" name="polybius_array_raw">
                              <option value="0">a-z</option>
                              <option value="1">五十音</option>
                              <option value="2">いろは</option>
                              <option value="3">自由入力</option>
                            </select>
                            <br><textarea id="polybius_rawarray_textarea" name="polybius_rawarray_textarea" rows="5em" cols="30em" readonly>abcdefghiklmnopqrstuvwxyz</textarea>
                            <br>有効値個数：<span id="polybius_rawarray_textarea_length">0</span>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div id="polybius_settings_input" class="tool-window" style="width:50%;">
                    <table>
                      <tbody>
                        <tr>
                          <th class="tool-window full-label tooltip">表の始点</th>
                          <td>
                            <label for="set_table_layout_1"><input type="radio" id="set_table_layout_1" name="set_table_layout" value="0" checked>左上始点</label><br>
                            <label for="set_table_layout_2"><input type="radio" id="set_table_layout_2" name="set_table_layout" value="1">右上始点</label>
                          </td>
                        </tr>
                        <tr>
                          <th>整列</th>
                          <td>
                            <label for="set_table_sorting_1"><input type="radio" id="set_table_sorting_1" name="set_table_sorting" value="0" checked>横</label><br>
                            <label for="set_table_sorting_2"><input type="radio" id="set_table_sorting_2" name="set_table_sorting" value="1">縦</label><br>
                            <label for="set_table_sorting_3"><input type="radio" id="set_table_sorting_3" name="set_table_sorting" value="2">横渦</label><br>
                            <label for="set_table_sorting_4"><input type="radio" id="set_table_sorting_4" name="set_table_sorting" value="3">縦渦</label>
                          </td>
                        </tr>
                        <tr>
                          <th><s>縦横の行／列の数</s></th>
                          <td>
                            <label for="is_change_row_col_1"><input type="radio" id="is_change_row_col_1" name="is_change_row_col" value="0" checked>自動設定</label>&nbsp;<label for="is_change_row_col_2"><input type="radio" id="is_change_row_col_2" name="is_change_row_col" value="1">指定値</label>
                            <br>
                            <label for="rows">縦：<input type="number" id="rows" name="rows" value="7" min="1" max="36"></label>&nbsp;<label for="cols">横：<input type="number" id="cols" name="cols" value="7" min="1" max="36"></label>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <hr>
                  <div id="polybius_special">
                    <p class="tool-window"><label for="is_equals_ij"><input type="checkbox" id="is_equals_ij" name="is_equals_ij"><s>【a-z】jをiとして扱う</s></label></p>
                    <p class="tool-window"><label for="is_dakuon_converts"><input type="checkbox" id="is_dakuon_converts" name="is_dakuon_converts"><s>【ひらがな／カタカナ】濁音を結合する</s></label></p>
                    <p class="tool-window"><label for="is_shinobi_cjk"><input type="checkbox" id="is_shinobi_cjk" name="is_shinobi_cjk"><s>【忍びいろは暗号】暗号文を固有漢字（環境依存）に変更する</s></label></p>
                  </div>
                </fieldset>
              </div>
            </form>
       		<script src="./main.js"></script>
          </div>
        </div>
        <div>
          <h3>Legacy Version</h3>
          <p><a href="/tools/polybius/" class="tool" target="_blank">ポリュビオス暗号ツール（旧版）</a>はこちら</p>
        </div>
      </article>
    </div>
  </body>
</html>
