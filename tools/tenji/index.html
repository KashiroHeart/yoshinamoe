<!DOCTYPE HTML>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Yoka">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="点字変換">
    <meta property="og:description" content="かな・漢字と6点／8点点字を相互に変換します。">
    <meta property="og:url" content="https://4472.web.fc2.com/tools/tenji/">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="ツール置き場">
    <title>点字変換</title>
    <link rel="stylesheet" href="/src/lib.css" />
    <script src="/src/lib.js"></script>
    <script src="/src/palette.js"></script>
    <link rel="stylesheet" href="./tenji.css">
    <script src="./src/main.js" type="module"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__crumb">
        <a href="/" class="site-header__home">ツール置き場</a>
        <span class="site-header__sep">/</span>
        <span class="site-header__title">点字変換</span>
      </div>
      <button type="button" class="palette-chip" aria-label="カラーパレットを切り替え">
        <span class="palette-chip__name"></span>
        <span class="palette-chip__swatches">
          <span class="sw sw--white"></span><span class="sw sw--p1"></span><span class="sw sw--p2"></span><span class="sw sw--p3"></span><span class="sw sw--black"></span>
        </span>
      </button>
    </header>

    <noscript>
      <p class="page-pad">JavaScript が無効になっているため、このツールは利用できません。</p>
    </noscript>

    <main class="tenji-main">
      <div class="tool-col">
        <div class="tool-field">
          <span class="label label--p1">入力</span>
          <span class="count" id="tj_in_label"></span>
        </div>
        <textarea id="input" class="tool-io" style="font-size: 17px; line-height: 1.9;" placeholder="変換したい文字を入力してください。"></textarea>

        <div class="tool-field">
          <span class="label label--p2">出力</span>
          <span class="count" id="tj_out_label"></span>
        </div>
        <div id="output" class="tool-io tool-io--out" style="font-size: 22px; line-height: 1.9;"></div>
        <div id="tj_rows" class="tool-io tool-io--out tenji-rows" hidden></div>

        <p class="tool-note tenji-warn"><span class="warn" id="tj_warn"></span></p>
      </div>

      <div class="tool-col tenji-col-right tool-drawer">
        <button type="button" class="drawer-toggle" data-drawer-toggle>設定</button>
        <div class="tool-drawer-body">
        <div class="subhead" style="padding-top: 4px;">6 点点字モード</div>
        <div class="tenji-modes" data-group="6"></div>

        <div class="subhead" style="margin-top: 12px;">8 点点字モード</div>
        <div class="tenji-modes" data-group="8"></div>

        <p style="margin-top: 18px;">
          <button type="button" id="tenji_run" class="btn-accent1" style="padding: 8px 22px;">↓　実行　↓</button>
        </p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>2025 Yoka / <a href="https://x.com/xx7_44" target="_blank">@xx7_44</a></p>
    </footer>
  </body>
</html>
