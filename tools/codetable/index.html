    <link rel="stylesheet" href="./codetable.css">
    <style>
      #nlist {
        margin: 20px auto 20px 20px;
        border-collapse: collapse;
      }
      #nlist th {
        border: 2.5px solid #aaa;
        width: 10em;
        text-align: center;
      }
      #nlist td {
        border: 1px solid #aaa;
        width: 10em;
        text-align: center;
      }
      .table {
        background-color: #222;
        border-radius: 0.25em;
        margin-top: 20px;
        padding: 3px;
      }
      
      #nshowing {
        padding: 5px;
        background-color: #222;
        border-radius: 0.25em;
      }
      #nshowing label {
        display:inline-block;
        text-align: center;
        min-width: 5em;
        padding: 2px 1em 2px 1em;
        margin: 0px 1px 0px 1px;
        background-color: #777;
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>

    <div class="background"></div>
    <header>

    <div class="container">
      <div class="ui">
        <p>表選択：<select id="nselect"><option value="-">---</option></select></p>

            並べ替え：&nbsp;<select id="nsort1"><option value="-">---</option></select>&nbsp;の&nbsp;<select id="nsort2"><option value="0">昇順</option><option value="1">降順</option></select>
          </p>
          <form id="nshowing" name="nshowing"></form>
        </fieldset>
        <div class="table">
          <table id="nlist">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
